# F03-NFR-007/009, F03-CEN-01/02 — disposable real WordPress/MariaDB smoke.
# Repository evidence only: never claims staging/live install or operational approval.
name: File 03 v12 WordPress 7.0.1 MariaDB 11.4 Integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FILE00_REF: edbc944d44398bf68b2765d99bdae26fe26846e4
  FILE00_VERSION: '1.2.44'
  FILE03_VERSION: '1.2.0-rc18'
  FILE03_DB_VERSION: '1.2.0'
  FILE03_CONTRACT_VERSION: '1.4.0'

jobs:
  real-wordpress-mariadb:
    name: Exact File 00 + File 03 fresh activation, schema, repair, no-live parity claim
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout exact File 03 candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: file03
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout pinned canonical File 00
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/00-sabri-membership-core
          path: file00
          persist-credentials: false
          ref: ${{ env.FILE00_REF }}
      - name: Prove exact pinned source inputs
        run: |
          set -euo pipefail
          test "$(git -C file03 rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git -C file00 rev-parse HEAD)" = "$FILE00_REF"
          grep -Fq "Version: ${FILE00_VERSION}" file00/source/sabri-membership-core/sabri-membership-core.php
          grep -Fq "Version: ${FILE03_VERSION}" file03/sabri-profiles-doctors.php
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
          extensions: mysqli,openssl
      - name: Install real WordPress 7.0.1 and exact plugin trees
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp
          mkdir -p /tmp/wordpress
          /tmp/wp core download --version=7.0.1 --path=/tmp/wordpress --quiet
          test "$(/tmp/wp core version --path=/tmp/wordpress)" = '7.0.1'
          /tmp/wp config create --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --path=/tmp/wordpress --skip-check --quiet
          /tmp/wp config set WP_ENVIRONMENT_TYPE 'staging' --type=constant --path=/tmp/wordpress
          /tmp/wp config set SMC_MASTER_KEY 'file03-disposable-integration-only-master-key-2026' --type=constant --path=/tmp/wordpress
          /tmp/wp config set SMC_MASTER_KEY_ID 'file03-ci-key-v1' --type=constant --path=/tmp/wordpress
          /tmp/wp core install --url=http://example.test --title='File 03 Disposable CI' --admin_user=admin --admin_password='Integration-Only-Password-2026!' --admin_email=admin@example.test --skip-email --path=/tmp/wordpress --quiet
          cp -R file00/source/sabri-membership-core /tmp/wordpress/wp-content/plugins/sabri-membership-core
          mkdir -p /tmp/wordpress/wp-content/plugins/sabri-profiles-doctors
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' --exclude='tools' file03/ /tmp/wordpress/wp-content/plugins/sabri-profiles-doctors/
      - name: Activate File 00 and finish canonical deferred bootstrap
        run: |
          set -euo pipefail
          /tmp/wp plugin activate sabri-membership-core --path=/tmp/wordpress
          /tmp/wp eval 'wp_set_current_user(1); if(!current_user_can("manage_options")) exit(1); do_action("admin_init"); if((string)get_option("smc_db_version","")!==SMC_DB_VERSION){fwrite(STDERR,"FAIL File00 deferred DB version\n");exit(1);} $state=get_option("smc_activation_bootstrap_state_v2",array()); if(!is_array($state)||($state["status"]??"")!=="ready"||SMC_Completion::safe_mode()){fwrite(STDERR,"FAIL File00 readiness\n");exit(1);} echo "PASS File00 canonical readiness\n";' --path=/tmp/wordpress
      - name: Activate File 03 and assert material schema readiness
        run: |
          set -euo pipefail
          /tmp/wp plugin activate sabri-profiles-doctors --path=/tmp/wordpress
          /tmp/wp eval 'if(!defined("SPD_VERSION")||SPD_VERSION!=="1.2.0-rc18"||SPD_DB_VERSION!=="1.2.0"||SPD_CONTRACT_VERSION!=="1.4.0") exit(1); foreach(array("spd_version"=>SPD_VERSION,"spd_db_version"=>SPD_DB_VERSION,"spd_contract_version"=>SPD_CONTRACT_VERSION,"spd_central_schema_version"=>SPD_Central_Profile::SCHEMA_VERSION,"spd_future_schema_version"=>SPD_Future_Profile::SCHEMA_VERSION) as $key=>$value){if((string)get_option($key,"")!==(string)$value){fwrite(STDERR,"FAIL option ".$key."\n");exit(1);}} if(!SPD_Schema_Guard::base_ready()||!SPD_Schema_Guard::central_ready()||!SPD_Schema_Guard::future_ready()){fwrite(STDERR,"FAIL exact schema shape\n");exit(1);} echo "PASS File03 real WordPress/MariaDB fresh activation and owned schemas\n";' --path=/tmp/wordpress
      - name: Diagnose failed initial option persistence (disposable CI only)
        if: failure()
        run: |
          set -euo pipefail
          /tmp/wp eval 'global $wpdb; foreach(array("spd_safe_mode","spd_migration_cursor") as $key){$v=get_option($key,null);$raw=$wpdb->get_var($wpdb->prepare("SELECT option_value FROM {$wpdb->options} WHERE option_name=%s",$key));echo wp_json_encode(array("key"=>$key,"exists"=>null!==$v,"type"=>gettype($v),"value"=>$v,"raw_db"=>$raw))."\\n";}' --path=/tmp/wordpress

      - name: Re-enter plugin and check safe idempotent repair
        run: |
          set -euo pipefail
          /tmp/wp eval 'wp_set_current_user(1); $repair=SPD_Activator::repair_owned_resources(); if(is_wp_error($repair)||!SPD_Schema_Guard::base_ready()||!SPD_Schema_Guard::central_ready()||!SPD_Schema_Guard::future_ready()){fwrite(STDERR,"FAIL File03 repair/schema\n");exit(1);} $manifest=SPD_Contracts::manifest(); if(($manifest["contract_version"]??"")!==SPD_CONTRACT_VERSION){exit(1);} echo "PASS File03 repeat request, safe repair, canonical contract\n";' --path=/tmp/wordpress
