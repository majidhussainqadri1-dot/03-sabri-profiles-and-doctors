name: Apply File 03 v2 source

on:
  push:
    branches:
      - codex/file-03-plan-completion-v2

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  apply:
    if: github.actor == 'majidhussainqadri1-dot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Fetch, verify and apply File 03 v2 payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues/4/comments?per_page=100",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          comments = json.load(urllib.request.urlopen(request))
          chunks = {}
          for comment in comments:
              body = comment.get("body", "")
              if body.startswith("FILE03V2:"):
                  _, number, data = body.split(":", 2)
                  chunks[number] = data.strip()

          order = ["00", "01", "02", "03", "04", "05", "06a", "06b", "06c", "06d", "06e", "06f", "07", "08", "09", "10a", "10b", "11a", "11b"]
          missing = [number for number in order if number not in chunks]
          if missing:
              raise SystemExit(f"Missing payload chunks: {missing}")

          if chunks["10a"].endswith("islav"):
              chunks["10a"] = chunks["10a"][:-5]

          expected = {
              "00": (7000, "6a93303fc7a6edfde7b13d7c009185bb03dee38faab21366e052cf30af93dd39"),
              "01": (7000, "9e5f6bb6e12b637800697f3b8de5bda5153f057079d89306385d1f96c4161a7a"),
              "02": (7000, "2ca4081e1d9654f5c5450c8fef49f5987f4f5b3321912b039cf0afe94b3e8746"),
              "03": (7000, "77c2167bef84b52d921e1b7d7c86ed2e4582592192f87c426050ef0b84c9ab3a"),
              "04": (7000, "a7d794480970a5a9b405620151f7fcb9b706e1f89c2d2d7ffe58d7c6b5eb1d56"),
              "05": (9000, "6441654100dfdf98e917dd79f365d604a9ccdae15e4aaf4a5f638fe4d582d4ec"),
              "06a": (1500, "7ee74ecb6d5f8a5023b3a5b2ceadf42b0c55e93aa85b9c390aae9f6d8b6a4c5c"),
              "06b": (1500, "f601404e96e156a2e825c152574913e68eb40b4db6a858df82d65336b6c57cd0"),
              "06c": (1500, "6a76796699f92f25f246836a934e51f810ff19f960927b805cff0859569f6543"),
              "06d": (1500, "6ac4f17a9e97723f2066046a28459f4ae491afa3141d6337b79bc76b6c67f619"),
              "06e": (1500, "492a9f13e7387a0919550ae763f54e2307e779692bf6c37f1e8488bdeffbd641"),
              "06f": (1500, "25c973ec7991e48ee6a9ddf1dbe8cb8fa6a69d63f6c87dae81c062d2da41e2de"),
              "07": (9000, "40941f134f4fefa4c8be4f6a9b53555d6192bc1ad4f71daeccc3b07f5eae72fd"),
              "08": (9000, "ad1e841bcb19b7b692503d6e0bc4aea13c6dd3a50e4d20b7aa64b7c0594e5325"),
              "09": (9000, "eda916418eb1f5e61055c579587ad749bedc310fe7ffda0c8430d0afb318f0c2"),
              "10a": (4500, "ddcca2f4ea008d551ae7ec62f97943ed86885a6921f7309c2f54531fbb787782"),
              "10b": (4500, "996d3d58137acd4a17a30f46b326d466478bdab8ddf6dea9df22536c2482f2c9"),
              "11a": (4500, "ccc3a411250ac9dadcc0d67e1468f4b1377e7fdac7014af6a8afcfff9d769819"),
              "11b": (1216, "d30deb5cf36a1a864c9e4cc19657025fab5f87fb9f22cee03eeeb2f548eb30c5"),
          }
          bad = []
          for number in order:
              data = chunks[number]
              actual_length = len(data)
              actual_sha = hashlib.sha256(data.encode("ascii")).hexdigest()
              expected_length, expected_sha = expected[number]
              print(f"CHUNK {number} len={actual_length} sha256={actual_sha} expected_len={expected_length} expected_sha={expected_sha}")
              if actual_length != expected_length or actual_sha != expected_sha:
                  bad.append(number)
          if bad:
              raise SystemExit(f"Chunk integrity mismatches: {bad}")

          payload = "".join(chunks[number] for number in order)
          with open("/tmp/file03.b64", "w", encoding="ascii") as handle:
              handle.write(payload)
          PY
          base64 -d /tmp/file03.b64 > /tmp/file03.tar.gz
          echo "72518f166c10cf89a123e100741301a17953eb3cc981069e275ff3e4623da9aa  /tmp/file03.tar.gz" | sha256sum -c -
          tar -xzf /tmp/file03.tar.gz -C .
          rm -f .github/workflows/apply-file03-v2.yml \
                .github/workflows/plan-completion.yml \
                .github/workflows/corrective-integrity.yml \
                .github/workflows/baseline-integrity.yml
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          git add -A
          git commit -m "Complete File 03 three-plan source implementation v2"
          git push origin HEAD:codex/file-03-plan-completion-v2
