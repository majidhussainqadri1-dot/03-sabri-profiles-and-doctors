name: Corrective Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - audit/**

permissions:
  contents: read

jobs:
  integrity:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/audit/')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'audit/'))
    name: Corrected source integrity and architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify baseline ancestry, historical provenance and current candidate boundary
        env:
          BASELINE_COMMIT: e2165a9286e6c3106430aab431d9d44da707cf51
          BASELINE_LOCK_SHA256: 5c178339045ebdf13f6977042141b4e78e378d293a302020eb49841835617571
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE_COMMIT" HEAD
          test "$(git show "$BASELINE_COMMIT:BASELINE-LOCK.json" | sha256sum | awk '{print $1}')" = "$BASELINE_LOCK_SHA256"
          git diff --exit-code origin/main -- RELEASE-INVENTORY.tsv RELEASE-CHECKSUMS.sha256 BASELINE-LOCK.json
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess, sys
          root = pathlib.Path('.')
          def fail(message):
              print(f'ERROR: {message}', file=sys.stderr)
              raise SystemExit(1)

          lock = json.loads((root/'RELEASE-LOCK.json').read_text(encoding='utf-8'))
          if lock.get('schema') != 3 or lock.get('record_type') != 'historical_source_archive_lock_with_current_candidate_boundary':
              fail('release-lock schema/record type is not the current historical-provenance model')
          if lock.get('historical_baseline_commit') != 'e2165a9286e6c3106430aab431d9d44da707cf51': fail('historical baseline commit drifted')
          if lock.get('historical_baseline_lock_sha256') != '5c178339045ebdf13f6977042141b4e78e378d293a302020eb49841835617571': fail('historical baseline lock digest drifted')
          if lock.get('production_authorized') is not False or lock.get('staging_authorized') is not False: fail('release lock must not authorize staging or production')
          if lock.get('deployed_version_verified') is not False: fail('repository release lock must not claim deployed-version verification')

          lines=(root/'RELEASE-INVENTORY.tsv').read_text(encoding='utf-8').splitlines()
          if not lines or lines[0] != 'sha256\tsize\tpath': fail('historical release inventory header is invalid')
          rows=[]
          for line in lines[1:]:
              if line:
                  digest,size_text,path=line.split('\t',2); rows.append((path,int(size_text),digest))
          paths=[r[0] for r in rows]
          if paths != sorted(paths) or len(paths) != len(set(paths)): fail('historical inventory must be sorted and unique')
          if len(rows) != int(lock['historical_source_file_count']): fail('historical source file count mismatch')
          php_count=sum(int(path.endswith('.php')) for path,_,_ in rows)
          total_size=sum(size for _,size,_ in rows)
          canonical=''.join(f'{digest}  {size}  {path}\n' for path,size,digest in rows)
          tree_sha=hashlib.sha256(canonical.encode()).hexdigest()
          if php_count != int(lock['historical_php_file_count']) or total_size != int(lock['historical_source_size']) or tree_sha != lock['historical_source_tree_sha256']: fail('historical inventory metadata does not match release lock')
          expected_checks=''.join(f'{digest}  {path}\n' for path,_,digest in rows)
          if (root/'RELEASE-CHECKSUMS.sha256').read_text(encoding='utf-8') != expected_checks: fail('historical checksum ledger does not match historical inventory')

          main=(root/'sabri-profiles-doctors.php').read_text(encoding='utf-8')
          readme=(root/'readme.txt').read_text(encoding='utf-8')
          m=re.search(r"^define\( 'SPD_VERSION', '([^']+)' \);$", main, re.M)
          if not m: fail('runtime version constant missing')
          version=m.group(1)
          if f'Version: {version}' not in main or f'Stable tag: {version}' not in readme: fail('runtime/readme version mismatch')
          if lock.get('current_repository_candidate') != version: fail('release-lock current candidate does not match runtime version')
          if version != '1.2.0-rc11' or 'TWENTY-ROUND-SEQUENTIAL-CORRECTIVE-REVIEW' not in main: fail('twenty-round rc11 corrective identity is not the current candidate')
          if 'TENTH-TEN-ROUND-CORRECTIVE-REVIEW' not in main: fail('historical tenth-review guarantee marker was lost')

          all_files={p.as_posix() for p in root.rglob('*') if p.is_file() and '.git' not in p.parts}
          required={
              'README.md','STATUS.md','CHANGELOG.md','RELEASE-LOCK.json','RELEASE-MANIFEST.md','RELEASE-INVENTORY.tsv','RELEASE-CHECKSUMS.sha256',
              'NINTH-TEN-ROUND-REVIEW-2026-08-11.md','tests/ninth-ten-round-review.py',
              'TENTH-TEN-ROUND-REVIEW-2026-08-12.md','tests/tenth-ten-round-review.py',
              'TWENTY-ROUND-SEQUENTIAL-REVIEW-2026-08-12.md','tests/twenty-round-sequential-review.py','tests/architecture-check.py',
              'includes/class-spd-slug-privacy.php','includes/class-spd-outbox-dispatcher.php','includes/class-spd-schema-guard.php'
          }
          missing=sorted(required-all_files)
          if missing: fail('missing current corrective evidence/files: '+', '.join(missing))
          forbidden_suffixes=('.zip','.tar','.tgz','.gz','.7z','.rar','.sql')
          forbidden=sorted(p for p in all_files if p.lower().endswith(forbidden_suffixes))
          if forbidden: fail('archive or database files committed: '+', '.join(forbidden))
          credential_names={'wp-config.php','credentials.json','service-account.json','id_rsa','id_dsa','id_ecdsa','id_ed25519'}
          for path in all_files:
              name=pathlib.PurePosixPath(path).name.lower()
              if name.startswith('.env') or name in credential_names: fail(f'forbidden credential filename committed: {path}')

          secret_patterns={
              'private key': rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',
              'Google API key': rb'\bAIza[0-9A-Za-z_-]{35}\b',
              'GitHub token': rb'\bgh[pousr]_[A-Za-z0-9]{20,}\b',
              'AWS access key': rb'\bAKIA[0-9A-Z]{16}\b',
              'JWT-like token': rb'\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b',
              'hardcoded Pakistan mobile': rb'\+923[0-9]{9}\b',
              'generic live secret': rb'(?i)(?:client_secret|api_key|access_token|db_password|authorization)\s*[:=]\s*["\'][^"\']{12,}["\']',
          }
          for path in sorted(all_files):
              data=(root/path).read_bytes()
              for label,pattern in secret_patterns.items():
                  if re.search(pattern,data): fail(f'possible {label} in {path}')

          workflow_text='\n'.join((root/p).read_text(encoding='utf-8') for p in ('.github/workflows/baseline-integrity.yml','.github/workflows/corrective-integrity.yml'))
          for pin in ('actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5','shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240'):
              if pin not in workflow_text: fail(f'workflow action pin missing: {pin}')
          if re.search(r'uses:\s+[^\s]+@(v\d+|main|master)\b', workflow_text): fail('mutable GitHub Action tag detected')
          subprocess.run([sys.executable,'tests/architecture-check.py'],check=True)
          subprocess.run([sys.executable,'tests/ninth-ten-round-review.py'],check=True)
          subprocess.run([sys.executable,'tests/tenth-ten-round-review.py'],check=True)
          subprocess.run([sys.executable,'tests/twenty-round-sequential-review.py'],check=True)
          print('Corrective rc11 twenty-round current-candidate integrity passed without reinterpreting historical inventory as current source truth.')
          PY

  php-lint:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/audit/')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'audit/'))
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up PHP from immutable action
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
          ini-file: production
      - name: Lint current source and run security unit checks
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
          php tests/security-unit.php
