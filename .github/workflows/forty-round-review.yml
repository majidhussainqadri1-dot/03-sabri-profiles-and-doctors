name: File 03 Forty-Round Review

on:
  push:
    branches:
      - 'codex/file-03-forty-round-review'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-and-review:
    name: PHP ${{ matrix.php }} — forty rounds and behavior
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
          ini-file: production
      - name: PHP syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -name '*.php' -type f -print0)
      - name: Forty sequential source reviews
        run: python3 tests/forty-round-review.py
      - name: Forty-round runtime helpers
        run: php tests/forty-round-runtime.php
      - name: Existing repository assurance suites
        run: |
          set -euo pipefail
          python3 tests/architecture-check.py
          python3 tests/source-security-regression.py
          python3 tests/schema-check.py
          python3 tests/plan-coverage.py
          php tests/bootstrap-load.php
          php tests/authorization-runtime.php
          php tests/verification-runtime.php
          php tests/state-runtime.php
          php tests/timeline-runtime.php

  deterministic-package:
    name: Deterministic package, checksum, SBOM and parity
    runs-on: ubuntu-latest
    needs: php-and-review
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Build twice
        run: |
          set -euo pipefail
          ./build-package.sh "$RUNNER_TEMP/a"
          ./build-package.sh "$RUNNER_TEMP/b"
      - name: Verify identity and determinism
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ \* Version: \(.*\)$/\1/p' sabri-profiles-doctors.php | head -1)"
          NAME="03-sabri-profiles-and-doctors-$VERSION.zip"
          cmp "$RUNNER_TEMP/a/$NAME" "$RUNNER_TEMP/b/$NAME"
          (cd "$RUNNER_TEMP/a" && sha256sum -c "$NAME.sha256")
          cmp "$RUNNER_TEMP/a/SBOM.json" "$RUNNER_TEMP/b/SBOM.json"
          unzip -q "$RUNNER_TEMP/a/$NAME" -d "$RUNNER_TEMP/extract"
          diff -u sabri-profiles-doctors.php "$RUNNER_TEMP/extract/03-sabri-profiles-and-doctors/sabri-profiles-doctors.php"
          diff -ru includes "$RUNNER_TEMP/extract/03-sabri-profiles-and-doctors/includes"
          diff -ru assets "$RUNNER_TEMP/extract/03-sabri-profiles-and-doctors/assets"
          diff -u uninstall.php "$RUNNER_TEMP/extract/03-sabri-profiles-and-doctors/uninstall.php"
          diff -u readme.txt "$RUNNER_TEMP/extract/03-sabri-profiles-and-doctors/readme.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file03-forty-round-rc3
          path: |
            ${{ runner.temp }}/a/*.zip
            ${{ runner.temp }}/a/*.sha256
            ${{ runner.temp }}/a/SBOM.json
          if-no-files-found: error
          retention-days: 14
