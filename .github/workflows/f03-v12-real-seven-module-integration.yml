# File 03 V12.3: real disposable cross-file WordPress integration.
# Canonical companion main pins refreshed on 2026-11-14: File00, File07 and File09.
# File26 pinned to the unmerged, separate D20 lifecycle payload companion PR #38; do not deploy independently.
# Does NOT deploy or alter Hostinger live/staging. File09 candidate is NOT merged.
name: File 03 v12 Seven-Plugin Real Cross-File Integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FILE00_REF: 1fad051c86d530d558be3eb1890d3c6e67bce6e8
  FILE02_REF: 224c39bcb8c28f77504c7348dbad41226753c7e8
  FILE07_REF: 8f9b567c08e9456daf31ebadf17b13bb307571f8
  FILE09_REF: 8f52f87a6d82fc89c6c78b7da80b474dff916d97
  FILE08_REF: d086840f7e2ac0ed328006385f064e0e2fb58cb1
  FILE26_REF: f654d2fdd9e00ace9acf46cce2f5fd5b8e50579e

jobs:
  seven-module-disposable-wordpress:
    name: File00/02/03/09/07/08/26 pinned WP7.0.1 + MariaDB11.4
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: file03
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/00-sabri-membership-core
          path: file00
          persist-credentials: false
          ref: ${{ env.FILE00_REF }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/02-sabri-authentication
          path: file02
          persist-credentials: false
          ref: ${{ env.FILE02_REF }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/09-global-doctor-onboarding-and-verification-completion
          path: file09
          persist-credentials: false
          ref: ${{ env.FILE09_REF }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/07-doctors-directory-and-discovery
          path: file07
          persist-credentials: false
          ref: ${{ env.FILE07_REF }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/08-worldwide-clinic-and-appointments-foundation
          path: file08
          persist-credentials: false
          ref: ${{ env.FILE08_REF }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/26-search-discovery-recommendations-knowledge-graph-classification
          path: file26
          persist-credentials: false
          ref: ${{ env.FILE26_REF }}
      - name: Prove immutable exact repository input set
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C file03 rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          for n in 00 02 07 09 08 26; do
            variable="FILE${n}_REF"
            test "$(git -C "file$n" rev-parse HEAD)" = "${!variable}"
          done
          grep -Fq "Version: 1.2.0-rc18" file03/sabri-profiles-doctors.php
          grep -Fq "Version: 1.2.44" file00/source/sabri-membership-core/sabri-membership-core.php
          grep -Fq "Version: 1.3.4" file02/sabri-authentication.php
          grep -Fq "Version: 1.3.0" file09/global-doctor-onboarding.php
          grep -Fq "Version: 1.2.2" file07/doctors-directory/doctors-directory.php
          grep -Fq "Version: 1.2.16" file08/worldwide-clinic.php
          grep -Fq "Version: 1.3.0" file26/file-26-search-discovery.php
      - uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
          extensions: mysqli,openssl
      - name: Create disposable exact WordPress and all seven installed packages
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp
          mkdir -p /tmp/wordpress
          /tmp/wp core download --version=7.0.1 --path=/tmp/wordpress --quiet
          test "$(/tmp/wp core version --path=/tmp/wordpress)" = '7.0.1'
          /tmp/wp config create --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --path=/tmp/wordpress --skip-check --quiet
          /tmp/wp config set WP_ENVIRONMENT_TYPE 'staging' --type=constant --path=/tmp/wordpress
          /tmp/wp config set WP_DEBUG true --raw --type=constant --path=/tmp/wordpress
          /tmp/wp config set WP_DEBUG_LOG true --raw --type=constant --path=/tmp/wordpress
          /tmp/wp config set WP_DEBUG_DISPLAY false --raw --type=constant --path=/tmp/wordpress
          /tmp/wp config set SMC_MASTER_KEY 'f03-disposable-integration-only-master-key-v12' --type=constant --path=/tmp/wordpress
          /tmp/wp config set SMC_MASTER_KEY_ID 'f03-disposable-ci-key-v12' --type=constant --path=/tmp/wordpress
          /tmp/wp config set SA_MASTER_KEY 'f02-disposable-integration-only-master-key-v12' --type=constant --path=/tmp/wordpress
          /tmp/wp config set GDO_KEYRING '{"active":"ci","keys":{"ci":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}}' --type=constant --path=/tmp/wordpress
          /tmp/wp config set GDO_CLAIM_SIGNING_KEY 'disposable-gdo-ci-v12-claim-signing-key-2026' --type=constant --path=/tmp/wordpress
          mkdir -p /tmp/f03-gdo-private
          chmod 700 /tmp/f03-gdo-private
          /tmp/wp config set GDO_PRIVATE_STORAGE_DIR '/tmp/f03-gdo-private' --type=constant --path=/tmp/wordpress
          /tmp/wp core install --url=http://example.test --title='F03 Seven Module Disposable CI' --admin_user=admin --admin_password='Integration-Only-Password-2026!' --admin_email=admin@example.test --skip-email --path=/tmp/wordpress --quiet
          root=/tmp/wordpress/wp-content/plugins
          cp -R file00/source/sabri-membership-core "$root/sabri-membership-core"
          for pair in '02 sabri-authentication sabri-authentication' '03 file03 sabri-profiles-doctors' '09 global-doctor-onboarding global-doctor-onboarding' '07 doctors-directory/doctors-directory doctors-directory' '08 worldwide-clinic worldwide-clinic' '26 file-26-search-discovery sabri-file26'; do
            read -r n f plugin <<< "$pair"
            src="file$n"
            if [[ "$n" == 07 ]]; then src="file07/doctors-directory"; fi
            mkdir -p "$root/$plugin"
            rsync -a --exclude='.git' --exclude='.github' --exclude='tests' --exclude='tools' --exclude='review-evidence' "$src/" "$root/$plugin/"
          done
      - name: File 00 deferred bootstrap is really completed
        run: |
          set -euo pipefail
          /tmp/wp plugin activate sabri-membership-core --path=/tmp/wordpress
          /tmp/wp eval 'wp_set_current_user(1);do_action("admin_init"); if((string)get_option("smc_db_version","")!==SMC_DB_VERSION||SMC_Completion::safe_mode()){fwrite(STDERR,"FAIL File00 schema/eligibility bootstrap\n");exit(1);} echo "PASS File00\n";' --path=/tmp/wordpress
      - name: File 02 current main professional reauthentication integration
        run: |
          set -euo pipefail
          /tmp/wp plugin activate sabri-authentication --path=/tmp/wordpress
          /tmp/wp eval 'if(!defined("SAUTH_PROFESSIONAL_REAUTH_VERSION")||!function_exists("smc_membership_assertions")){fwrite(STDERR,"FAIL File02 or File00 APIs\n");exit(1);} echo "PASS File02 current main\n";' --path=/tmp/wordpress
      - name: File 03 fresh install and owned DB schema
        run: |
          set -euo pipefail
          /tmp/wp plugin activate sabri-profiles-doctors --path=/tmp/wordpress
          /tmp/wp eval 'if(!class_exists("SPD_Schema_Guard")||!SPD_Schema_Guard::base_ready()||!SPD_Schema_Guard::central_ready()||!SPD_Schema_Guard::future_ready()){fwrite(STDERR,"FAIL File03 DB shape\n");exit(1);} echo "PASS File03\n";' --path=/tmp/wordpress
      - name: V12.3 runtime-installed source and schema read-only freeze smoke
        run: |
          set -euo pipefail
          /tmp/wp eval-file file03/tools/f03-v123-readonly-freeze.php --path=/tmp/wordpress > /tmp/f03-v123-runtime-freeze.json
          php -r '
            $json = json_decode(file_get_contents("/tmp/f03-v123-runtime-freeze.json"), true);
            if (!is_array($json) || ($json["source"] ?? "") !== "installed-wordpress-runtime"
              || empty($json["file03"]["installed_manifest_sha256"])
              || ($json["file03"]["declared_plugin_version"] ?? "") !== "1.2.0-rc18"
              || ($json["file03"]["schema_base_ready"] ?? null) !== true
              || ($json["file03"]["schema_central_ready"] ?? null) !== true
              || ($json["file03"]["schema_future_ready"] ?? null) !== true
              || isset($json["credentials"]) || isset($json["users"])) {
                fwrite(STDERR, "FAIL File03 V12.3 runtime freeze read-only evidence shape\n");
                exit(1);
              }
            echo "PASS File03 installed-version, schema, manifest and safe-mode read-only freeze\n";
          '
      - name: V12.3 approved source to installed runtime manifest parity
        run: |
          set -euo pipefail
          python3 file03/tools/f03-v123-manifest-parity.py --approved-root file03 --installed-json /tmp/f03-v123-runtime-freeze.json
      - name: D17 real MariaDB nested savepoint / rollback atomicity
        run: |
          set -euo pipefail
          /tmp/wp eval-file file03/tests/wp-mariadb-nested-transaction-runtime.php --path=/tmp/wordpress
      - name: File 09 true doctor identity verification provider with synthetic CI keyring
        run: |
          set -euo pipefail
          /tmp/wp plugin activate global-doctor-onboarding --path=/tmp/wordpress
          /tmp/wp eval 'if(!GDO_Crypto::available()||!GDO_Membership_Adapter::available()||!GDO_Membership_Adapter::authentication_available()||!SPD_Verification_Adapter::available()){fwrite(STDERR,"FAIL current File09/File03 provider interoperability\n");exit(1);} echo "PASS File09 File03 current claims\n";' --path=/tmp/wordpress
      - name: File 07 doctor directory consuming File03/File09 current claims
        run: |
          set -euo pipefail
          /tmp/wp plugin activate doctors-directory --path=/tmp/wordpress
          /tmp/wp eval 'if(!class_exists("SDD_Helpers")||!class_exists("DDD_Activator")){fwrite(STDERR,"FAIL File07 directory\n");exit(1);} echo "PASS File07\n";' --path=/tmp/wordpress
      - name: File 08 worldwide clinic outbox and current appointments
        run: |
          set -euo pipefail
          /tmp/wp plugin activate worldwide-clinic --path=/tmp/wordpress
          /tmp/wp eval 'if(!SWC_Activator::dependencies_ready()||!has_action("wca_outbox_event")){fwrite(STDERR,"FAIL File08 profile owner event integration\n");exit(1);} echo "PASS File08 File03 outbox transport\n";' --path=/tmp/wordpress
      - name: Confirm File08 never enters runtime migration failure on normal boot
        run: |
          set -euo pipefail
          /tmp/wp eval 'if(get_option("wca_runtime_migration_failure",false)){fwrite(STDERR,"FAIL File08 migration failure flag present\\n");exit(1);} if(!has_action("init",array("WCA_Routes","register"))){fwrite(STDERR,"FAIL File08 init-time route missing\\n");exit(1);} echo "PASS File08 runtime migration clean and init route registered\\n";' --path=/tmp/wordpress
          if [[ -f /tmp/wordpress/wp-content/debug.log ]]; then
            if grep -Fq '"event":"runtime_migration_failed"' /tmp/wordpress/wp-content/debug.log; then
              echo 'FAIL File08 runtime migration error was logged during genuine WP startup'
              exit 1
            fi
          fi
      - name: File26 D20 strict lifecycle payload contract source regression
        run: |
          set -euo pipefail
          php file26/tests/file03-professional-lifecycle-payload.php
      - name: File 26 schema and canonical File03 connector collection
        run: |
          set -euo pipefail
          /tmp/wp plugin activate sabri-file26 --path=/tmp/wordpress
          /tmp/wp eval '$owner=\Sabri\File26\Plugin::instance()->connectors()->get("file03-profiles"); if(!\Sabri\File26\DB::schema_physical_ok()||!is_array($owner)||($owner["owner_file"]??"")!=="File 03"||!is_callable($owner["can_view"]??null)||!is_callable($owner["list_batch"]??null)){fwrite(STDERR,"FAIL File26/File03 current connector\n");exit(1);} if(($owner["status"]??"")==="active"){fwrite(STDERR,"FAIL unapproved connector unexpectedly production-active\n");exit(1);} echo "PASS File26 File03 canonical adapter, inactive governance\n";' --path=/tmp/wordpress
      - name: Surface disposable WordPress PHP fatal evidence without weakening production controls
        if: failure()
        run: |
          if [[ -f /tmp/wordpress/wp-content/debug.log ]]; then
            tail -n 100 /tmp/wordpress/wp-content/debug.log
          else
            echo "No WP debug.log created; do not infer root cause from surface error."
          fi

      - name: Real WordPress File03/File26 callback denial for invalid stored document
        run: |
          set -euo pipefail
          /tmp/wp eval '$owner=\Sabri\File26\Plugin::instance()->connectors()->get("file03-profiles");$cb=$owner["can_view"]; $invalid=array("object_id"=>"00000000-0000-4000-8000-000000000000","object_version"=>1,"entity_type"=>"doctor","payload"=>array("verified_doctor"=>true)); if(true===call_user_func($cb,$invalid,array())){fwrite(STDERR,"FAIL unknown owner ID shown\n");exit(1);} echo "PASS real-owner callback refuses missing canonical profile\n";' --path=/tmp/wordpress
      - name: Verify actual File26 normalizer runtime contract for current owner ACL
        run: |
          set -euo pipefail
          /tmp/wp eval 'if(!class_exists("\\Sabri\\File26\\Normalizer")){fwrite(STDERR,"FAIL File26 current normalizer unavailable\\n");exit(1);} $n=new \Sabri\File26\Normalizer(); if($n->normalize("Doctor  Classical-Homeopathy")!=="doctor classical-homeopathy"){fwrite(STDERR,"FAIL File26 owner search normalizer mismatch\\n");exit(1);} echo "PASS File26 production normalizer for source-body ACL\\n";' --path=/tmp/wordpress

      - name: Real WordPress File03 owner full-snapshot metadata scope and negative partial test
        run: |
          set -euo pipefail
          /tmp/wp eval '$owner=\Sabri\File26\Plugin::instance()->connectors()->get("file03-profiles"); if(!is_array($owner)||!is_callable($owner["list_batch"]??null)){fwrite(STDERR,"FAIL File03 connector batch unavailable\n");exit(1);} $fn=$owner["list_batch"]; $full=call_user_func($fn,"",10,array("connector"=>"file03-profiles")); if(!is_array($full)||!isset($full["items"])||!is_array($full["items"])||!array_key_exists("done",$full)){fwrite(STDERR,"FAIL File26 full scope owner batch not valid\n");exit(1);} $partial=call_user_func($fn,"",10,array("connector"=>"file03-profiles","mode"=>"partial")); if(!is_wp_error($partial)){fwrite(STDERR,"FAIL unknown partial scope accepted\n");exit(1);} $wrong=call_user_func($fn,"",10,array("connector"=>"file07-doctors")); if(!is_wp_error($wrong)){fwrite(STDERR,"FAIL wrong connector routing key accepted\n");exit(1);} echo "PASS WordPress File03 File26 full-scope and partial fail-closed\n";' --path=/tmp/wordpress

      - name: Summarize pinned disposable integration evidence
        if: always()
        run: |
          if [[ -x /tmp/wp ]]; then /tmp/wp plugin list --fields=name,status,version --format=table --path=/tmp/wordpress || true; fi
          echo "This is disposable CI, NOT Hostinger staging acceptance, live deploy, or owner approval."
