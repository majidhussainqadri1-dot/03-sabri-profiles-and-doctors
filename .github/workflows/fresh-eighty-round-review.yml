name: File 03 Fresh Eighty-Round Review

on:
  push:
    branches:
      - main
      - codex/file-03-fresh-80-review-20260810
      - codex/file-03-second-fresh-80-review-20260810
      - codex/file-03-third-ten-round-20260811
      - codex/file-03-fourth-ten-round-20260811
      - codex/file-03-fifth-ten-round-20260811
      - codex/file-03-sixth-ten-round-20260811
      - codex/file-03-seventh-ten-round-20260811
      - codex/file-03-eighth-ten-round-20260811
      - audit/file-03-ninth-ten-round-20260811
      - audit/file-03-tenth-ten-round-20260812
      - audit/file-03-twentieth-round-sequential-20260812
      - audit/file-03-second-twenty-round-20260812
      - audit/file-03-third-twenty-round-20260812
      - audit/file-03-fourth-twenty-round-20260812
      - audit/file-03-fifth-twenty-round-20260813-clean
      - audit/file-03-sixth-twenty-round-20260813
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-candidate-review:
    name: Exact candidate — fresh 80-round corrective gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: First fresh exact-main 80-round invariants
        run: python3 tests/fresh-eighty-round-review.py
      - name: Second fresh 80-round invariants
        run: python3 tests/second-fresh-eighty-round-review.py
      - name: Third ten-round corrective invariants
        run: python3 tests/third-ten-round-review.py
      - name: Fourth ten-round corrective invariants
        run: python3 tests/fourth-ten-round-review.py
      - name: Fifth ten-round corrective invariants
        run: python3 tests/fifth-ten-round-review.py
      - name: Sixth ten-round corrective invariants
        run: python3 tests/sixth-ten-round-review.py
      - name: Seventh ten-round corrective invariants
        run: python3 tests/seventh-ten-round-review.py
      - name: Eighth ten-round corrective invariants
        run: python3 tests/eighth-ten-round-review.py
      - name: Ninth ten-round corrective invariants
        run: python3 tests/ninth-ten-round-review.py
      - name: Tenth ten-round corrective invariants
        run: python3 tests/tenth-ten-round-review.py
      - name: Twenty-round sequential corrective invariants
        run: python3 tests/twenty-round-sequential-review.py
      - name: Second twenty-round sequential corrective invariants
        run: python3 tests/second-twenty-round-sequential-review.py
      - name: Third twenty-round sequential corrective invariants
        run: python3 tests/third-twenty-round-sequential-review.py
      - name: Fourth twenty-round sequential corrective invariants
        run: python3 tests/fourth-twenty-round-sequential-review.py
      - name: Fifth twenty-round sequential corrective invariants
        run: python3 tests/fifth-twenty-round-sequential-review.py
      - name: Fifth-cycle R18 release/package invariants
        run: python3 tests/fifth-twenty-round-r18-release.py
      - name: Fifth-cycle R19 contract invariants
        run: python3 tests/fifth-twenty-round-r19-contracts.py
      - name: Fifth-cycle R20 final closure invariants
        run: python3 tests/fifth-twenty-round-r20-final.py
      - name: Future Superset 18 coverage
        run: python3 tests/future-superset-coverage.py
      - name: Latest governing-plan coverage
        run: python3 tests/latest-plan-coverage.py
      - name: Architecture and fresh governing review gates
        run: |
          python3 tests/architecture-check.py
          python3 tests/future-two-review-gates.py
          python3 tests/latest-plan-review-1.py
          python3 tests/latest-plan-review-2.py
      - name: Existing forty-round regression
        run: python3 tests/forty-round-review.py
      - name: Runtime composition and security smoke
        run: |
          php tests/bootstrap-load.php
          php tests/authorization-runtime.php
          php tests/security-unit.php
          php tests/state-runtime.php
          php tests/verification-runtime.php
          php tests/timeline-runtime.php
          php tests/forty-round-runtime.php

  exact-package-parity:
    name: Exact HEAD — deterministic ZIP, checksum, SBOM and source/package parity
    runs-on: ubuntu-latest
    needs: exact-candidate-review
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Build exact source twice
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build-package.sh
          VERSION="$(sed -n 's/^ \* Version: \(.*\)$/\1/p' sabri-profiles-doctors.php | head -1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ./build-package.sh "$RUNNER_TEMP/package-a"
          ./build-package.sh "$RUNNER_TEMP/package-b"
      - name: Verify deterministic ZIP, checksum and SBOM
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.pkg.outputs.version }}"
          TOP='03-sabri-profiles-and-doctors'
          NAME="$TOP-$VERSION.zip"
          cmp "$RUNNER_TEMP/package-a/$NAME" "$RUNNER_TEMP/package-b/$NAME"
          cmp "$RUNNER_TEMP/package-a/$NAME.sha256" "$RUNNER_TEMP/package-b/$NAME.sha256"
          cmp "$RUNNER_TEMP/package-a/SBOM.json" "$RUNNER_TEMP/package-b/SBOM.json"
          (cd "$RUNNER_TEMP/package-a" && sha256sum -c "$NAME.sha256")
          python3 - "$RUNNER_TEMP/package-a/SBOM.json" "$VERSION" <<'PY'
          import json, pathlib, sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data.get('name') == '03-sabri-profiles-and-doctors'
          assert data.get('version') == sys.argv[2]
          assert data.get('format') == 'SPDX-lite'
          assert isinstance(data.get('files'), list) and data['files']
          assert all({'path','size','sha256'} <= set(row) for row in data['files'])
          PY
      - name: Verify single top-level folder and exact runtime parity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.pkg.outputs.version }}"
          TOP='03-sabri-profiles-and-doctors'
          NAME="$TOP-$VERSION.zip"
          mkdir -p "$RUNNER_TEMP/extract"
          unzip -q "$RUNNER_TEMP/package-a/$NAME" -d "$RUNNER_TEMP/extract"
          test "$(find "$RUNNER_TEMP/extract" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | wc -l)" -eq 1
          test -d "$RUNNER_TEMP/extract/$TOP"
          diff -u sabri-profiles-doctors.php "$RUNNER_TEMP/extract/$TOP/sabri-profiles-doctors.php"
          diff -u uninstall.php "$RUNNER_TEMP/extract/$TOP/uninstall.php"
          diff -u readme.txt "$RUNNER_TEMP/extract/$TOP/readme.txt"
          diff -ru includes "$RUNNER_TEMP/extract/$TOP/includes"
          diff -ru assets "$RUNNER_TEMP/extract/$TOP/assets"
          {
            printf '%s\n' sabri-profiles-doctors.php uninstall.php readme.txt
            find includes assets -type f -print
          } | LC_ALL=C sort > "$RUNNER_TEMP/source-files.txt"
          find "$RUNNER_TEMP/extract/$TOP" -type f -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/package-files.txt"
          diff -u "$RUNNER_TEMP/source-files.txt" "$RUNNER_TEMP/package-files.txt"
          test ! -e "$RUNNER_TEMP/extract/$TOP/tests"
          test ! -e "$RUNNER_TEMP/extract/$TOP/.github"
          test ! -e "$RUNNER_TEMP/extract/$TOP/RELEASE-LOCK.json"
          test ! -e "$RUNNER_TEMP/extract/$TOP/STAGING-ACCEPTANCE.md"
      - name: Verify SBOM hashes match packaged runtime bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/package-a/SBOM.json" "$RUNNER_TEMP/extract/03-sabri-profiles-and-doctors" <<'PY'
          import hashlib, json, pathlib, sys
          sbom=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          root=pathlib.Path(sys.argv[2])
          sbom_rows={row['path']: row for row in sbom['files']}
          packaged={p.relative_to(root).as_posix(): p for p in root.rglob('*') if p.is_file()}
          assert set(sbom_rows) == set(packaged), (set(sbom_rows)^set(packaged))
          for rel,p in packaged.items():
              b=p.read_bytes()
              assert sbom_rows[rel]['size'] == len(b), rel
              assert sbom_rows[rel]['sha256'] == hashlib.sha256(b).hexdigest(), rel
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file03-${{ steps.pkg.outputs.version }}-${{ github.sha }}-exact-package
          path: |
            ${{ runner.temp }}/package-a/*.zip
            ${{ runner.temp }}/package-a/*.sha256
            ${{ runner.temp }}/package-a/SBOM.json
          if-no-files-found: error
          retention-days: 14
