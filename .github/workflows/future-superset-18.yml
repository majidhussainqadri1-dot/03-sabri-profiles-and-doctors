name: File 03 Future Superset 18

on:
  push:
    branches:
      - main
      - 'codex/file-03-future-superset-18'
      - 'codex/file-03-eighty-round-corrective-review'
      - 'codex/file-03-fifth-ten-round-20260811'
      - 'codex/file-03-sixth-ten-round-20260811'
      - 'codex/file-03-seventh-ten-round-20260811'
      - 'codex/file-03-eighth-ten-round-20260811'
      - 'audit/file-03-ninth-ten-round-20260811'
      - 'audit/file-03-tenth-ten-round-20260812'
      - 'audit/file-03-twentieth-round-sequential-20260812'
      - 'audit/file-03-second-twenty-round-20260812'
      - 'audit/file-03-third-twenty-round-20260812'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-and-runtime:
    name: PHP ${{ matrix.php }} — future superset, 80-round and regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
          ini-file: production
      - name: PHP syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -name '*.php' -type f -print0)
      - name: JavaScript syntax
        run: |
          node --check assets/js/profiles.js
          node --check assets/js/future-profiles.js
      - name: Latest governing coverage
        run: python3 tests/latest-plan-coverage.py
      - name: Future Superset 18 coverage
        run: python3 tests/future-superset-coverage.py
      - name: Eighty numbered corrective review gates
        run: python3 tests/eighty-round-review-ci.py
      - name: Existing File 03 regression suites
        run: python3 tests/regression-ci.py
      - name: Sixth ten-round corrective invariants
        run: python3 tests/sixth-ten-round-review.py
      - name: Seventh ten-round corrective invariants
        run: python3 tests/seventh-ten-round-review.py
      - name: Eighth ten-round corrective invariants
        run: python3 tests/eighth-ten-round-review.py
      - name: Ninth ten-round corrective invariants
        run: python3 tests/ninth-ten-round-review.py
      - name: Tenth ten-round corrective invariants
        run: python3 tests/tenth-ten-round-review.py
      - name: Twenty-round sequential corrective invariants
        run: python3 tests/twenty-round-sequential-review.py
      - name: Second twenty-round sequential corrective invariants
        run: python3 tests/second-twenty-round-sequential-review.py
      - name: Third twenty-round sequential corrective invariants
        run: python3 tests/third-twenty-round-sequential-review.py

  fresh-reviews:
    name: Two fresh post-correction review/fix gates
    runs-on: ubuntu-latest
    needs: source-and-runtime
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Fresh review 1 — independent 80-round adversarial invariants
        run: python3 tests/eighty-round-adversarial.py
      - name: Fresh review 2a — future privacy/provider/degradation
        run: python3 tests/future-two-review-gates.py
      - name: Fresh review 2b — preserved latest-plan requirements/boundaries
        run: python3 tests/latest-plan-review-1.py
      - name: Fresh review 2c — preserved latest-plan adversarial degradation
        run: python3 tests/latest-plan-review-2.py

  deterministic-package:
    name: Deterministic package, checksum, SBOM and corrective parity
    runs-on: ubuntu-latest
    needs: fresh-reviews
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Build twice
        run: |
          set -euo pipefail
          ./build-package.sh "$RUNNER_TEMP/a"
          ./build-package.sh "$RUNNER_TEMP/b"
      - name: Verify determinism and packaged corrective files
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ \* Version: \(.*\)$/\1/p' sabri-profiles-doctors.php | head -1)"
          test "$VERSION" = "1.2.0-rc13"
          NAME="03-sabri-profiles-and-doctors-$VERSION.zip"
          cmp "$RUNNER_TEMP/a/$NAME" "$RUNNER_TEMP/b/$NAME"
          (cd "$RUNNER_TEMP/a" && sha256sum -c "$NAME.sha256")
          cmp "$RUNNER_TEMP/a/SBOM.json" "$RUNNER_TEMP/b/SBOM.json"
          unzip -q "$RUNNER_TEMP/a/$NAME" -d "$RUNNER_TEMP/extract"
          TOP="$RUNNER_TEMP/extract/03-sabri-profiles-and-doctors"
          for f in includes/class-spd-future-profile.php includes/class-spd-future-rest.php includes/class-spd-future-privacy.php includes/class-spd-slug-privacy.php includes/class-spd-outbox-dispatcher.php includes/class-spd-central-rest.php includes/class-spd-plugin.php includes/class-spd-media.php includes/trait-spd-profile-identity-create.php includes/trait-spd-profile-public-dto.php includes/trait-spd-profile-professional.php includes/trait-spd-profile-edit-model.php includes/trait-spd-frontend-future.php assets/js/future-profiles.js; do test -f "$TOP/$f"; done
          diff -u sabri-profiles-doctors.php "$TOP/sabri-profiles-doctors.php"
          diff -ru includes "$TOP/includes"
          diff -ru assets "$TOP/assets"
          diff -u uninstall.php "$TOP/uninstall.php"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file03-future-superset-18-1.2.0-rc13-third-twenty-round
          path: |
            ${{ runner.temp }}/a/*.zip
            ${{ runner.temp }}/a/*.sha256
            ${{ runner.temp }}/a/SBOM.json
          if-no-files-found: error
          retention-days: 14
