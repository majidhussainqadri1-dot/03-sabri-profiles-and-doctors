name: Apply File 03 Forty-Round Patch

on:
  push:
    branches:
      - 'codex/file-03-forty-round-review'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Diagnose reconstructed patch
        run: |
          set -euo pipefail
          sha256sum .patchparts/part*
          cat .patchparts/part* > /tmp/file03.patch.b64
          wc -c /tmp/file03.patch.b64
          sha256sum /tmp/file03.patch.b64
          base64 -d /tmp/file03.patch.b64 > /tmp/file03.patch.gz
          sha256sum /tmp/file03.patch.gz
          gzip -t /tmp/file03.patch.gz
