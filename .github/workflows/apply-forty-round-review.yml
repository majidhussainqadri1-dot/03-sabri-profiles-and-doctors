name: Apply File 03 Forty-Round Patch

on:
  push:
    branches:
      - 'codex/file-03-forty-round-review'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Reconstruct, apply and commit reviewed patch
        run: |
          set -euo pipefail
          cat .patchparts/part* | base64 -d > /tmp/file03.patch.gz
          gzip -dc /tmp/file03.patch.gz > /tmp/file03.patch
          git apply --index /tmp/file03.patch
          git rm -r .patchparts .github/workflows/apply-forty-round-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete File 03 forty-round review and corrections'
          git push origin HEAD:codex/file-03-forty-round-review
