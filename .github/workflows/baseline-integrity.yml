name: Baseline Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - baseline/**

permissions:
  contents: read

jobs:
  immutable-baseline:
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/baseline/'))) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'baseline/'))
    name: Immutable original baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Verify baseline lock
        run: |
          set -euo pipefail
          test "$(sha256sum BASELINE-LOCK.json | awk '{print $1}')" = "5c178339045ebdf13f6977042141b4e78e378d293a302020eb49841835617571"
          echo "Original baseline lock is intact."
