name: Baseline Integrity

on:
  pull_request:
  push:
    branches:
      - main
      - baseline/**
      - audit/**

permissions:
  contents: read

jobs:
  integrity:
    name: Exact source inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Verify canonical baseline
        env:
          EXPECTED_LOCK_SHA256: "5c178339045ebdf13f6977042141b4e78e378d293a302020eb49841835617571"
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path('.')
          lock_path = root / 'BASELINE-LOCK.json'
          inventory_path = root / 'SOURCE-INVENTORY.tsv'
          checksums_path = root / 'CHECKSUMS.sha256'

          def fail(message):
              print(f'ERROR: {message}', file=sys.stderr)
              raise SystemExit(1)

          lock_bytes = lock_path.read_bytes()
          actual_lock_sha = hashlib.sha256(lock_bytes).hexdigest()
          expected_lock_sha = '5c178339045ebdf13f6977042141b4e78e378d293a302020eb49841835617571'
          if actual_lock_sha != expected_lock_sha:
              fail(f'BASELINE-LOCK.json SHA-256 mismatch: {actual_lock_sha}')

          lock = json.loads(lock_bytes.decode('utf-8'))
          if lock.get('archive_committed') is not False:
              fail('archive_committed must remain false')
          if lock.get('archive_sha256') != '5d4d251faab2879e2894c29ce29b3cf50615898ca065fc1502832805231518ee':
              fail('archive SHA-256 does not match external provenance')

          lines = inventory_path.read_text(encoding='utf-8').splitlines()
          if not lines or lines[0] != 'sha256\tsize\tpath':
              fail('SOURCE-INVENTORY.tsv header is invalid')

          rows = []
          for line in lines[1:]:
              if not line:
                  continue
              digest, size_text, path = line.split('\t', 2)
              rows.append((path, int(size_text), digest))

          paths = [row[0] for row in rows]
          if paths != sorted(paths):
              fail('source inventory is not sorted')
          if len(paths) != len(set(paths)):
              fail('duplicate source path in inventory')
          if len(rows) != lock['source_file_count']:
              fail('source file count does not match lock')

          governance = {
              'README.md',
              'SOURCE-PROVENANCE.md',
              'STATUS.md',
              'MANIFEST.md',
              'CHECKSUMS.sha256',
              'SOURCE-INVENTORY.tsv',
              'BASELINE-LOCK.json',
              '.github/workflows/baseline-integrity.yml',
          }
          required_governance = governance.copy()
          all_files = {
              p.as_posix()
              for p in root.rglob('*')
              if p.is_file() and '.git' not in p.parts
          }
          missing_governance = sorted(required_governance - all_files)
          if missing_governance:
              fail('missing governance files: ' + ', '.join(missing_governance))

          actual_source = all_files - governance
          expected_source = set(paths)
          missing = sorted(expected_source - actual_source)
          unexpected = sorted(actual_source - expected_source)
          if missing:
              fail('missing source files: ' + ', '.join(missing))
          if unexpected:
              fail('unexpected source files: ' + ', '.join(unexpected))

          forbidden_suffixes = ('.zip', '.tar', '.tgz', '.gz', '.7z', '.rar', '.sql')
          forbidden = sorted(p for p in all_files if p.lower().endswith(forbidden_suffixes))
          if forbidden:
              fail('archive or database files must not be committed: ' + ', '.join(forbidden))

          forbidden_names = []
          for path in all_files:
              name = pathlib.PurePosixPath(path).name.lower()
              if name.startswith('.env') or name in {
                  'wp-config.php', 'credentials.json', 'service-account.json',
                  'id_rsa', 'id_dsa', 'id_ecdsa', 'id_ed25519',
              }:
                  forbidden_names.append(path)
          if forbidden_names:
              fail('forbidden credential filename committed: ' + ', '.join(sorted(forbidden_names)))

          canonical = []
          checksum_lines = []
          total_size = 0
          php_count = 0
          for path, expected_size, expected_sha in rows:
              data = (root / path).read_bytes()
              actual_size = len(data)
              actual_sha = hashlib.sha256(data).hexdigest()
              if actual_size != expected_size:
                  fail(f'size mismatch for {path}: {actual_size}')
              if actual_sha != expected_sha:
                  fail(f'SHA-256 mismatch for {path}: {actual_sha}')
              canonical.append(f'{actual_sha}  {actual_size}  {path}')
              checksum_lines.append(f'{actual_sha}  {path}')
              total_size += actual_size
              php_count += int(path.endswith('.php'))

          tree_text = '\n'.join(canonical) + '\n'
          tree_sha = hashlib.sha256(tree_text.encode('utf-8')).hexdigest()
          if tree_sha != lock['source_tree_sha256']:
              fail(f'source-tree SHA-256 mismatch: {tree_sha}')
          if total_size != lock['source_size']:
              fail(f'source size mismatch: {total_size}')
          if php_count != lock['php_file_count']:
              fail(f'PHP file count mismatch: {php_count}')

          expected_checksums = '\n'.join(checksum_lines) + '\n'
          if checksums_path.read_text(encoding='utf-8') != expected_checksums:
              fail('CHECKSUMS.sha256 does not exactly match the inventory')

          main_plugin = (root / 'sabri-profiles-doctors.php').read_text(encoding='utf-8')
          readme = (root / 'readme.txt').read_text(encoding='utf-8')
          version = lock['plugin_version']
          if f'Version: {version}' not in main_plugin:
              fail('plugin header version does not match lock')
          if f"define( 'SPD_VERSION', '{version}' );" not in main_plugin:
              fail('SPD_VERSION does not match lock')
          if f'Stable tag: {version}' not in readme:
              fail('readme stable tag does not match lock')

          secret_patterns = {
              'private key': rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',
              'Google API key': rb'\bAIza[0-9A-Za-z_-]{35}\b',
              'GitHub token': rb'\bgh[pousr]_[A-Za-z0-9]{20,}\b',
              'AWS access key': rb'\bAKIA[0-9A-Z]{16}\b',
              'JWT-like token': rb'\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b',
              'generic live secret assignment': rb'(?i)(?:client_secret|api_key|access_token|db_password|authorization)\s*[:=]\s*["\'][^"\']{12,}["\']',
          }
          for path in sorted(all_files):
              data = (root / path).read_bytes()
              for label, pattern in secret_patterns.items():
                  if re.search(pattern, data):
                      fail(f'possible {label} found in {path}')

          workflow = (root / '.github/workflows/baseline-integrity.yml').read_text(encoding='utf-8')
          required_pins = (
              'actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5',
              'shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240',
          )
          for pin in required_pins:
              if pin not in workflow:
                  fail(f'workflow action is not pinned: {pin}')
          if re.search(r'uses:\s+[^\s]+@(v\d+|main|master)\b', workflow):
              fail('mutable GitHub Action tag detected')

          print('Baseline integrity verification passed.')
          print(f'Source files: {len(rows)}')
          print(f'PHP files: {php_count}')
          print(f'Source bytes: {total_size}')
          print(f'Source-tree SHA-256: {tree_sha}')
          PY

  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.3'
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up PHP from immutable action
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
          ini-file: production

      - name: Lint exact PHP source inventory
        run: |
          set -euo pipefail
          mapfile -t php_files < <(awk -F '\t' 'NR > 1 && $3 ~ /\.php$/ { print $3 }' SOURCE-INVENTORY.tsv)
          if [ "${#php_files[@]}" -ne 8 ]; then
            echo "Expected 8 PHP files; found ${#php_files[@]}" >&2
            exit 1
          fi
          for file in "${php_files[@]}"; do
            php -l "$file"
          done
