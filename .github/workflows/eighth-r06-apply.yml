name: File 03 Eighth R06 Apply

on:
  push:
    branches:
      - audit/file-03-eighth-twenty-round-20260829
    paths:
      - '.github/workflows/eighth-r06-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: true
      - name: Apply frozen R06 defect ledger
        run: |
          echo '' | base64 -d > /tmp/r06.py
          python3 /tmp/r06.py
          php -l includes/class-spd-observability.php
      - name: Commit corrective batch and self-delete
        run: |
          git config user.name sabri-review-bot
          git config user.email actions@users.noreply.github.com
          git add includes/class-spd-observability.php
          git rm .github/workflows/eighth-r06-apply.yml
          git commit -m "File 03 eighth cycle R06: restore migration schedule in repair"
          git push origin HEAD:audit/file-03-eighth-twenty-round-20260829